<!--
  IGREJA FONTE · Cajamar — Através de Você
  Projeto da Pra. Thamires: todo mês um culto com data, tema e paleta de cores
  (tabela atraves_de_voce, editável no painel). A página toma a cor do tema da edição.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Através de Você · Igreja Fonte</title>
<meta name="description" content="Através de Você: todo mês um culto com tema e paleta de cores na Igreja Fonte.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --abismo:#0a0a0b; --breu:#101013; --grafite:#17171b; --grafite-2:#1f1f25;
    --neblina:#2a2a31; --cinza:#8b8b95; --cinza-claro:#b8b8c0; --luz:#f5f5f6;
    --agua:#7ad4cf;
    --tema:#B8734F;   /* trocada pela cor da edição */
    --display:"Bricolage Grotesque", system-ui, sans-serif;
    --corpo:"Inter", system-ui, sans-serif;
    --raio:16px; --raio-sm:11px; --borda:1px solid var(--neblina); --largura:1040px;
    --logo:url('assets/fonte-logo.png');
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--abismo);color:var(--luz);font-family:var(--corpo);line-height:1.6;
       -webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}
  .wrap{max-width:var(--largura);margin:0 auto;padding:0 22px}

  header{position:sticky;top:0;z-index:20;background:rgba(10,10,11,.78);
         backdrop-filter:saturate(140%) blur(14px);border-bottom:var(--borda)}
  .nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:64px;max-width:var(--largura);margin:0 auto;padding:0 22px}
  .voltar{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;color:var(--cinza-claro);font-weight:500;grid-column:1;justify-self:start}
  .voltar:hover{color:var(--luz)}
  .marca{grid-column:2;justify-self:center;display:inline-flex;align-items:center}
  .marca-logo{background:var(--logo) center/contain no-repeat;width:100px;height:50px}

  /* brilho de fundo na cor do tema */
  .luz-tema{position:fixed;inset:-30vh -20vw auto;height:90vh;z-index:-1;pointer-events:none;
            background:radial-gradient(closest-side,color-mix(in srgb,var(--tema) 34%,transparent),transparent);opacity:.55}

  .hero{padding-top:46px;padding-bottom:10px}
  .eyebrow{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--cinza);font-weight:600}
  h1{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,7vw,3.6rem);letter-spacing:-.03em;line-height:1;margin:14px 0 8px}
  .intro{color:var(--cinza-claro);margin-top:12px;font-size:1.02rem;max-width:640px}

  .prox{margin-top:30px;display:grid;grid-template-columns:1.25fr 1fr;gap:26px;align-items:center;
        border:1px solid color-mix(in srgb,var(--tema) 40%,var(--neblina));border-radius:22px;padding:22px;
        background:linear-gradient(135deg,var(--grafite) 0%,color-mix(in srgb,var(--tema) 16%,var(--grafite)) 100%)}
  .prox picture img{border-radius:14px;width:100%;cursor:zoom-in;box-shadow:0 18px 50px rgba(0,0,0,.45)}
  .selo{display:inline-flex;align-items:center;gap:8px;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--tema)}
  .selo .dot{width:8px;height:8px;border-radius:50%;background:var(--tema);box-shadow:0 0 0 5px color-mix(in srgb,var(--tema) 25%,transparent)}
  .quando{font-family:var(--display);font-size:1.15rem;font-weight:700;margin-top:14px;color:var(--cinza-claro)}
  .tema{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,7vw,4rem);line-height:.95;letter-spacing:-.03em;color:var(--tema);margin:6px 0 4px;overflow-wrap:anywhere}
  .sub{font-size:.85rem;letter-spacing:.2em;text-transform:uppercase;color:var(--luz);font-weight:600}
  .frase{color:var(--cinza-claro);font-style:italic;margin-top:10px}
  .pregam{list-style:none;margin-top:16px;display:flex;flex-direction:column;gap:6px}
  .pregam li{display:flex;align-items:center;gap:10px;font-size:.95rem}
  .pregam li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--tema)}
  .onde{color:var(--cinza);font-size:.88rem;margin-top:14px}
  .conta{display:inline-block;margin-top:16px;border:1px solid color-mix(in srgb,var(--tema) 55%,transparent);color:var(--luz);
         border-radius:100px;padding:7px 14px;font-size:.84rem;font-weight:600;background:color-mix(in srgb,var(--tema) 18%,transparent)}

  .sec{margin-top:54px}
  .sec h2{font-family:var(--display);font-size:clamp(1.6rem,4vw,2.1rem);font-weight:800;letter-spacing:-.02em;line-height:1.05}
  .sec .lead{color:var(--cinza-claro);margin-top:8px;max-width:620px}

  .cores{margin-top:22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  .cor{border:var(--borda);border-radius:var(--raio);overflow:hidden;background:var(--grafite);cursor:pointer;text-align:left;
       color:inherit;font:inherit;transition:transform .2s,border-color .2s}
  .cor:hover{transform:translateY(-3px);border-color:var(--cinza)}
  .cor .amostra{height:92px}
  .cor .info{padding:12px 14px}
  .cor b{display:block;font-family:var(--display);font-size:1.02rem}
  .cor span{font-size:.8rem;color:var(--cinza);font-family:ui-monospace,Menlo,monospace}
  .cor.copiado span{color:var(--agua)}
  .ver-arte{display:inline-block;margin-top:16px;color:var(--cinza);font-size:.86rem;border-bottom:1px solid var(--neblina)}
  .ver-arte:hover{color:var(--luz)}

  /* Inspire-se: carrossel com a foto do meio grande e as vizinhas menores ao lado */
  .insp{position:relative;margin-top:26px;--w:300px;--h:380px;height:calc(var(--h) + 70px);user-select:none;touch-action:pan-y;overflow:hidden}
  .insp-palco{position:absolute;left:50%;top:0;width:var(--w);height:var(--h);transform:translateX(-50%);perspective:1200px}
  .insp-item{position:absolute;inset:0;border-radius:18px;overflow:hidden;background:var(--grafite);border:1px solid rgba(255,255,255,.08);
             box-shadow:0 30px 60px -30px #000;cursor:pointer;transition:transform .65s cubic-bezier(.2,.8,.2,1),opacity .65s,filter .65s;
             will-change:transform}
  .insp-item img{width:100%;height:100%;object-fit:cover;display:block}
  .insp-item.on{cursor:zoom-in;border-color:color-mix(in srgb,var(--tema) 55%,transparent)}
  .insp-item .leg{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 12px;color:#fff;font-family:var(--display);font-weight:700;font-size:1.05rem;
                  background:linear-gradient(180deg,transparent,rgba(0,0,0,.72));display:flex;align-items:center;gap:8px;opacity:0;transition:opacity .4s}
  .insp-item.on .leg{opacity:1}
  .insp-item .leg i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.7);flex:0 0 auto}
  .insp-nav{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:14px}
  .insp-nav button{width:40px;height:40px;border-radius:50%;border:1px solid var(--neblina);background:var(--grafite);color:var(--luz);font-size:1.3rem;cursor:pointer;
                   display:inline-flex;align-items:center;justify-content:center;transition:border-color .2s}
  .insp-nav button:hover{border-color:var(--tema)}
  .insp-dots{display:flex;gap:6px}
  .insp-dots i{width:7px;height:7px;border-radius:50%;background:var(--neblina);transition:background .3s,transform .3s}
  .insp-dots i.on{background:var(--tema);transform:scale(1.3)}
  @media(max-width:600px){.insp{--w:220px;--h:290px;margin-left:-22px;margin-right:-22px}}   /* as fotos dos lados vão até a borda da tela, sem alargar a página */
  @media(prefers-reduced-motion:reduce){.insp-item{transition:none}}

  .anteriores{margin-top:20px;display:flex;flex-direction:column}
  .ant{display:grid;grid-template-columns:96px 1fr auto;gap:16px;align-items:center;padding:14px 4px;border-bottom:1px solid rgba(42,42,49,.6)}
  .ant .mes{font-size:.78rem;color:var(--cinza);text-transform:uppercase;letter-spacing:.1em}
  .ant b{font-family:var(--display);font-size:1.1rem}
  .bolinhas{display:flex}
  .bolinhas i{width:18px;height:18px;border-radius:50%;border:2px solid var(--abismo);margin-left:-5px}
  .vazio{color:var(--cinza);padding:40px 0;text-align:center}

  .lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
  .lb.on{display:flex}
  .lb img{max-height:92vh;max-width:96vw;border-radius:12px}

  footer{margin-top:60px;border-top:var(--borda);background:var(--breu)}
  .foot{max-width:var(--largura);margin:0 auto;padding:26px 22px;display:flex;justify-content:space-between;
        gap:16px;flex-wrap:wrap;color:var(--cinza);font-size:.82rem}
  .foot .dev-cred{color:var(--agua)}

  @media(max-width:760px){
    .prox{grid-template-columns:1fr;padding:16px}
    .ant{grid-template-columns:78px 1fr}
    .ant .bolinhas{grid-column:2}
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase.js"></script>
<script>
  // reserva, caso o banco não responda
  var PADRAO=[{data:'2026-11-27',hora:'19h30',tema:'Revival',subtitulo:'Último do ano',frase:'Preparando o altar para 2027',
    preletores:'Pra. Thamires Ponciano\nPra. Jemima Gonzalez\nMiss Rhayline Resplande',endereco:'Rua Catiguá, 130 · Cajamar/SP',
    paleta_nome:'Paleta Glow',cor:'#B8734F',flyer_url:'assets/atraves/2026-11-revival.jpg',banner_url:'assets/atraves/2026-11-revival-largo.jpg',
    paleta_url:'assets/atraves/2026-11-paleta.jpg',
    fotos:[{url:'assets/atraves/2026-11-look-champagne.jpg',legenda:'Champagne'},{url:'assets/atraves/2026-11-look-nude-glow.jpg',legenda:'Nude Glow'},
           {url:'assets/atraves/2026-11-look-rose-brilho.jpg',legenda:'Rosé Brilho'},{url:'assets/atraves/2026-11-look-dourado-suave.jpg',legenda:'Dourado Suave'},
           {url:'assets/atraves/2026-11-look-terracota.jpg',legenda:'Terracota'},{url:'assets/atraves/2026-11-look-marrom-glow.jpg',legenda:'Marrom Glow'}],
    cores:[{nome:'Champagne',hex:'#F8EBD9'},{nome:'Nude Glow',hex:'#E7C6B8'},{nome:'Rosé Brilho',hex:'#D4A496'},
           {nome:'Dourado Suave',hex:'#CFA370'},{nome:'Terracota',hex:'#B8734F'},{nome:'Marrom Glow',hex:'#6B4A3A'}]}];

  var MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  var SEM=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
  function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function hexOk(h){ return /^#[0-9a-f]{6}$/i.test(h||'') ? h : '#B8734F'; }
  function dt(iso){ return new Date(iso+'T00:00:00'); }
  function hojeIso(){ var h=new Date(); return h.getFullYear()+'-'+String(h.getMonth()+1).padStart(2,'0')+'-'+String(h.getDate()).padStart(2,'0'); }

  function abreFoto(src){ var lb=document.getElementById('lb'); lb.querySelector('img').src=src; lb.classList.add('on'); }
  document.getElementById('lb').onclick=function(){ this.classList.remove('on'); };

  function render(lista){
    var box=document.getElementById('conteudo'), hoje=hojeIso();
    lista=lista.slice().sort(function(a,b){ return a.data<b.data?-1:1; });
    var futuras=lista.filter(function(e){ return e.data>=hoje; }), passadas=lista.filter(function(e){ return e.data<hoje; }).reverse();
    var e=futuras[0]||passadas[0];
    if(!e){ box.innerHTML='<div class="vazio">Em breve, o tema do próximo Através de Você.</div>'; return; }
    var cor=hexOk(e.cor), x=dt(e.data), dias=Math.round((x-dt(hoje))/864e5);
    document.documentElement.style.setProperty('--tema',cor);
    var cores=Array.isArray(e.cores)?e.cores:[];
    var pregam=String(e.preletores||'').split('\n').map(function(t){return t.trim();}).filter(Boolean);
    var arte=e.flyer_url||e.banner_url;
    var html='<section class="prox">'+
      (arte?'<picture>'+(e.banner_url&&e.flyer_url?'<source media="(min-width:761px)" srcset="'+esc(e.banner_url)+'">':'')+
        '<img src="'+esc(arte)+'" alt="Através de Você · '+esc(e.tema)+'" data-zoom></picture>':'')+
      '<div><span class="selo"><span class="dot"></span>'+(dias>=0?'Próxima edição':'Última edição')+'</span>'+
        '<div class="quando">'+SEM[x.getDay()]+', '+x.getDate()+' de '+MESES[x.getMonth()]+(e.hora?' · '+esc(e.hora):'')+'</div>'+
        '<div class="tema">'+esc(e.tema)+'</div>'+
        (e.subtitulo?'<div class="sub">'+esc(e.subtitulo)+'</div>':'')+
        (e.frase?'<p class="frase">'+esc(e.frase)+'</p>':'')+
        (pregam.length?'<ul class="pregam">'+pregam.map(function(p){return '<li>'+esc(p)+'</li>';}).join('')+'</ul>':'')+
        (e.endereco?'<p class="onde">'+esc(e.endereco)+'</p>':'')+
        (dias>=0?'<span class="conta">'+(dias>1?'Faltam '+dias+' dias':dias===1?'É amanhã':'É hoje')+'</span>':'')+
      '</div></section>';
    if(cores.length||e.paleta_url){
      html+='<section class="sec"><span class="eyebrow">Como vir vestido</span><h2>'+esc(e.paleta_nome||'Paleta de cores')+'</h2>'+
        '<p class="lead">Escolha uma ou mais cores da paleta para vir ao culto. Toque numa cor para copiar o código.</p>'+
        '<div class="cores">'+cores.map(function(c){ var h=hexOk(c.hex);
          return '<button class="cor" data-hex="'+h+'"><div class="amostra" style="background:'+h+'"></div><div class="info"><b>'+esc(c.nome||h)+'</b><span>'+h.toUpperCase()+'</span></div></button>'; }).join('')+'</div>'+
      '</section>';
    }
    // Inspire-se: fotos de looks nas cores do tema (coluna fotos; a edição de novembro tem as fotos no código)
    var fotos=Array.isArray(e.fotos)?e.fotos.filter(function(f){return f&&f.url;}):[];
    if(!fotos.length && PADRAO[0].data===e.data) fotos=PADRAO[0].fotos;
    if(fotos.length){
      html+='<section class="sec"><span class="eyebrow">Inspire-se</span><h2>Looks nas cores do tema</h2>'+
        '<p class="lead">Ideias de como vestir cada cor da paleta. Toque nas fotos ao lado para ver as outras.</p>'+
        '<div class="insp" id="insp"><div class="insp-palco">'+fotos.map(function(f,i){
          var c=cores.find(function(x){return (x.nome||'').toLowerCase()===(f.legenda||'').toLowerCase();});
          return '<figure class="insp-item" data-i="'+i+'"><img src="'+esc(f.url)+'" alt="'+esc(f.legenda||'Look')+'" loading="lazy" draggable="false">'+
            (f.legenda?'<figcaption class="leg">'+(c?'<i style="background:'+hexOk(c.hex)+'"></i>':'')+esc(f.legenda)+'</figcaption>':'')+'</figure>';
        }).join('')+'</div>'+
        '<div class="insp-nav"><button id="inspAnt" aria-label="Anterior">‹</button><div class="insp-dots" id="inspDots">'+fotos.map(function(){return '<i></i>';}).join('')+'</div><button id="inspProx" aria-label="Próxima">›</button></div></div>'+
        (e.paleta_url?'<a class="ver-arte" href="'+esc(e.paleta_url)+'" data-arte>Ver a arte completa da paleta</a>':'')+
      '</section>';
    } else if(e.paleta_url){
      html+='<section class="sec"><span class="eyebrow">Inspire-se</span><h2>Looks nas cores do tema</h2>'+
        '<img src="'+esc(e.paleta_url)+'" alt="'+esc(e.paleta_nome||'Paleta')+'" data-zoom loading="lazy" style="margin-top:22px;max-width:520px;border-radius:var(--raio);cursor:zoom-in"></section>';
    }
    var outras=lista.filter(function(o){ return o!==e && o.data<hoje; }).reverse();
    if(outras.length){
      html+='<section class="sec"><span class="eyebrow">Edições anteriores</span><h2>Temas que já vivemos</h2><div class="anteriores">'+
        outras.map(function(o){ var od=dt(o.data), oc=Array.isArray(o.cores)?o.cores:[];
          return '<div class="ant"><div class="mes">'+MESES[od.getMonth()].slice(0,3)+' '+od.getFullYear()+'</div><div><b style="color:'+hexOk(o.cor)+'">'+esc(o.tema)+'</b>'+
            (o.subtitulo?'<div style="color:var(--cinza);font-size:.85rem">'+esc(o.subtitulo)+'</div>':'')+'</div>'+
            '<div class="bolinhas">'+oc.slice(0,8).map(function(c){return '<i style="background:'+hexOk(c.hex)+'"></i>';}).join('')+'</div></div>'; }).join('')+
      '</div></section>';
    }
    box.innerHTML=html;
    box.querySelectorAll('[data-zoom]').forEach(function(im){ im.onclick=function(){ abreFoto(im.currentSrc||im.src); }; });
    box.querySelectorAll('[data-arte]').forEach(function(a){ a.onclick=function(ev){ ev.preventDefault(); abreFoto(a.getAttribute('href')); }; });
    montaInspire();
    box.querySelectorAll('.cor').forEach(function(b){ b.onclick=function(){
      var h=b.dataset.hex.toUpperCase(), s=b.querySelector('span');
      (navigator.clipboard?navigator.clipboard.writeText(h):Promise.reject()).then(function(){
        b.classList.add('copiado'); s.textContent='Copiado!'; setTimeout(function(){ b.classList.remove('copiado'); s.textContent=h; },1400);
      }).catch(function(){});
    }; });
  }

  // carrossel Inspire-se: a foto ativa fica grande no centro; as vizinhas, menores e mais apagadas dos lados
  function montaInspire(){
    var box=document.getElementById('insp'); if(!box) return;
    var itens=Array.prototype.slice.call(box.querySelectorAll('.insp-item')), dots=Array.prototype.slice.call(box.querySelectorAll('.insp-dots i'));
    var n=itens.length, i=0, timer=null, reduz=matchMedia('(prefers-reduced-motion:reduce)').matches;
    function vai(k){
      i=(k+n)%n;
      itens.forEach(function(el,j){
        var d=j-i; if(d>n/2) d-=n; if(d<-n/2) d+=n;      // distância circular até a ativa
        var ad=Math.abs(d), vis=ad<=2;
        el.classList.toggle('on',d===0);
        el.style.zIndex=10-ad;
        el.style.opacity=vis?(d===0?1:ad===1?.75:.4):0;
        el.style.filter=d===0?'none':'brightness(.75)';
        el.style.pointerEvents=vis?'':'none';
        el.style.transform='translateX('+(d*62)+'%) translateZ('+(-ad*140)+'px) rotateY('+(-d*18)+'deg) scale('+(d===0?1:ad===1?.8:.62)+')';
      });
      dots.forEach(function(p,j){ p.classList.toggle('on',j===i); });
    }
    function auto(){ clearInterval(timer); if(!reduz && n>1) timer=setInterval(function(){ vai(i+1); },4200); }
    itens.forEach(function(el,j){ el.onclick=function(){ if(j===i) abreFoto(el.querySelector('img').src); else vai(j); auto(); }; });
    dots.forEach(function(p,j){ p.onclick=function(){ vai(j); auto(); }; });
    document.getElementById('inspAnt').onclick=function(){ vai(i-1); auto(); };
    document.getElementById('inspProx').onclick=function(){ vai(i+1); auto(); };
    box.addEventListener('mouseenter',function(){ clearInterval(timer); });
    box.addEventListener('mouseleave',auto);
    var x0=null;
    box.addEventListener('touchstart',function(ev){ x0=ev.touches[0].clientX; clearInterval(timer); },{passive:true});
    box.addEventListener('touchend',function(ev){ if(x0===null) return; var dx=ev.changedTouches[0].clientX-x0; if(Math.abs(dx)>40) vai(i+(dx<0?1:-1)); auto(); x0=null; });
    vai(0); auto();
  }
